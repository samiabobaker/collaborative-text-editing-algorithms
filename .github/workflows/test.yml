name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - working-directory: code
        run: |
          for file in $(find . -name 'test_*.py' | sort); do
            module=$(echo "${file#./}" | tr / . | sed 's/\.py$//')
            echo "== $module"
            python -m "$module"
          done
