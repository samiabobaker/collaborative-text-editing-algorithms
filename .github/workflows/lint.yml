name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.3"
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.3"
          args: "format --check"
