[project]
name="collaborative-text-editing-algorithms"
description="A survey of collaborative text editing algorithms."
version="1.0"
requires-python = ">=3.14"

[dependency-groups]
dev = ["ruff==0.16.3"]

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["code"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modernize syntax for your target version)
    "B",   # bugbear (common bug patterns)
    "SIM", # simplify
]
ignore = [
    "E501",
    "E741",
    "F841"
]

[tool.ruff.format]
quote-style = "double"